<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Duckit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #18181b;
    }

    .header {
      background: #18181b;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo { font-size: 18px; }
    .app-name { color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }

    .body { padding: 14px; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      background: #f4f4f5;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #52525b;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #d4d4d8; flex-shrink: 0; }
    .dot.live  { background: #22c55e; }
    .dot.error { background: #ef4444; }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #eab308; color: #000; }
    .btn-primary:hover { background: #ca8a04; }
    .btn-ghost { background: #f4f4f5; color: #18181b; margin-top: 8px; }
    .btn-ghost:hover { background: #e4e4e7; }

    .user-card {
      background: #fefce8;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #78716c;
      margin-bottom: 10px;
    }
    .user-card strong { color: #18181b; display: block; margin-top: 2px; font-size: 13px; }

    .hint {
      font-size: 11px;
      color: #a1a1aa;
      text-align: center;
      margin-top: 10px;
      line-height: 1.5;
    }

    .login-box {
      text-align: center;
      padding: 4px 0 8px;
    }
    .login-box p {
      font-size: 12px;
      color: #71717a;
      margin-bottom: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🦆</span>
    <span class="app-name">Duckit</span>
  </div>

  <div class="body">
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">Prüfe Status…</span>
    </div>

    <!-- Not logged in -->
    <div id="login-view">
      <div class="login-box">
        <p>Melde dich in der Web-App an — die Extension erkennt dich danach automatisch.</p>
        <button class="btn btn-primary" id="open-login-btn">🦆 Bei Duckit anmelden</button>
      </div>
    </div>

    <!-- Logged in -->
    <div id="loggedin-view" style="display:none">
      <div class="user-card">
        Eingeloggt als<strong id="user-email">–</strong>
      </div>
      <button class="btn btn-primary" id="open-app-btn">App öffnen ↗</button>
      <button class="btn btn-ghost" id="logout-btn">Abmelden</button>
      <p class="hint">Text markieren → Rechtsklick<br/>→ „✂️ In Duckit speichern"</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
