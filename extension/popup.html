<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipNote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; }

    .header { background: #18181b; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .logo { width: 28px; height: 28px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .title { color: #fff; font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }

    .body { padding: 16px; }

    .status { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; margin-bottom: 12px; font-size: 12px; color: #52525b; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #a1a1aa; flex-shrink: 0; }
    .dot.connected { background: #22c55e; }
    .dot.error { background: #ef4444; }

    label { display: block; font-size: 11px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input { width: 100%; border: 1px solid #e4e4e7; border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; transition: border-color 0.15s; }
    input:focus { border-color: #18181b; }

    .btn { width: 100%; margin-top: 10px; padding: 9px; background: #18181b; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: #27272a; }
    .btn.secondary { background: #f4f4f5; color: #18181b; }
    .btn.secondary:hover { background: #e4e4e7; }

    .user-info { font-size: 12px; color: #52525b; padding: 10px 12px; background: #fff; border: 1px solid #e4e4e7; border-radius: 10px; margin-bottom: 10px; }
    .user-email { font-weight: 600; color: #18181b; }

    .open-app { display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✂️</div>
    <span class="title">ClipNote</span>
  </div>

  <div class="body">
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Prüfe Verbindung…</span>
    </div>

    <div id="login-view">
      <label for="email">E-Mail</label>
      <input type="email" id="email" placeholder="deine@email.de" />
      <button class="btn" id="login-btn">Magic Link senden</button>
    </div>

    <div id="logged-in-view" style="display:none">
      <div class="user-info">
        Angemeldet als<br />
        <span class="user-email" id="user-email-display"></span>
      </div>
      <a href="#" class="btn open-app" id="open-app-btn" target="_blank">
        App öffnen ↗
      </a>
      <button class="btn secondary" id="logout-btn" style="margin-top:8px">Abmelden</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
